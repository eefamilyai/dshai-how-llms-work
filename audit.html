<div class="c" style="left:4px;top:222px"><canvas id="p5-art" width="280" height="172" style="width:280px;height:172px"></canvas></div>
<div class="c" style="left:290px;top:222px"><canvas id="p6-art" width="280" height="172" style="width:280px;height:172px"></canvas></div>
<div class="c" style="left:576px;top:222px"><canvas id="p7-art" width="280" height="172" style="width:280px;height:172px"></canvas></div>
<div class="c" style="left:862px;top:222px"><canvas id="p8-art" width="280" height="172" style="width:280px;height:172px"></canvas></div>
<div class="c" style="left:1148px;top:222px"><canvas id="p9-art" width="280" height="172" style="width:280px;height:172px"></canvas></div>
<div class="c" style="left:4px;top:418px"><canvas id="p10-art" width="280" height="172" style="width:280px;height:172px"></canvas></div>
<div class="c" style="left:290px;top:418px"><canvas id="p11-art" width="280" height="172" style="width:280px;height:172px"></canvas></div>
<div class="c" style="left:576px;top:418px"><canvas id="p12-art" width="280" height="172" style="width:280px;height:172px"></canvas></div>
<div class="c" style="left:862px;top:418px"><canvas id="p13-art" width="280" height="172" style="width:280px;height:172px"></canvas></div><pre id="out">measuring...</pre>
<script src="anim.js?v=9"></script>
<script>
var IDS="hero-art","p1-art","p2-art","p3-art","p4-art","p5-art","p6-art","p7-art","p8-art","p9-art","p10-art","p11-art","p12-art","p13-art";
function st(id){
  var cv=document.getElementById(id), c=cv.getContext("2d");
  var W=cv.width,H=cv.height,d=c.getImageData(0,0,W,H).data;
  var lum=0,n=0;
  for(var y=0;y<H;y+=2)for(var x=0;x<W;x+=2){
    var i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2],a=d[i+3]; if(a<10)continue;
    var L=0.299*r+0.587*g+0.114*b;
    if(L<22) continue;               /* ignore the dark background itself */
    lum+=L; n++;
  }
  return {ink:n, mean: n? lum/n : 0};
}
setTimeout(function(){
  var rows=[], sum=0;
  for(var i=0;i<IDS.length;i++){ var s=st(IDS[i]); rows.push([IDS[i],s]); sum+=s.mean; }
  rows.sort(function(a,b){return a[1].mean-b[1].mean;});
  var out=rows.map(function(r){
    var f = r[1].mean<70?"  <-- DIM":(r[1].mean<110?"  <- soft":"");
    return r[0].padEnd(11)+" ink="+String(r[1].ink).padStart(6)+"  meanInk="+r[1].mean.toFixed(0).padStart(4)+f;
  }).join("\n");
  document.getElementById("out").textContent=out+"\nAVG meanInk "+((sum/IDS.length)).toFixed(0);
}, 13500);
</script></body></html>
