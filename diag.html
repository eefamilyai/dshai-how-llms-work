<!doctype html><html><head><meta charset="utf-8"><title>diag</title>
<style>body{margin:0;background:#04060c}canvas{display:block;width:100vw;height:100vh}
textarea{position:fixed;left:0;bottom:0;width:100%;height:52px;font:10px monospace;z-index:9}
#rep{position:fixed;left:0;top:0;color:#22d3ee;font:13px monospace;white-space:pre;z-index:9}
</style></head><body>
<canvas id="p2-art"></canvas><pre id="rep">waiting</pre>
<textarea id="px"></textarea>
<script src="anim.js"></script>
<script>
function stats(){
  var cv=document.getElementById("p2-art"), c=cv.getContext("2d");
  var W=cv.width,H=cv.height, d=c.getImageData(0,0,W,H).data;
  var n=0,bx0=1e9,by0=1e9,bx1=-1,by1=-1,g=0,a2=0,w=0,gT=0,gB=0,aT=0,aB=0;
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    var i=(y*W+x)*4,r=d[i],gg=d[i+1],b=d[i+2],al=d[i+3];
    if(al<10)continue;
    var lum=0.299*r+0.587*gg+0.114*b;
    if(lum<26&&Math.abs(r-gg)<14&&Math.abs(gg-b)<14)continue;
    n++; if(x<bx0)bx0=x; if(y<by0)by0=y; if(x>bx1)bx1=x; if(y>by1)by1=y;
    if(gg>150&&r<140&&b>90&&b<190){g++; if(y>H*0.55)gB++; else gT++;}
    if(r>190&&gg>140&&b<110){a2++; if(y>H*0.55)aB++; else aT++;}
    if(r>220&&gg>220&&b>220)w++;
  }
  return ["canvas "+W+"x"+H,
   "drawn "+n+"  bbox x["+bx0+","+bx1+"] y["+by0+","+by1+"]",
   "white "+w+" (letters)",
   "green "+g+" top="+gT+" bot="+gB+" (common ids)",
   "amber "+a2+" top="+aT+" bot="+aB+" (rare ids)",
   "centre="+(W/2|0)+" bboxCentre="+((bx0+bx1)/2|0),
   "clipped="+((by1>=H-3)?"YES":"no")+"  offCentre="+((Math.abs((bx0+bx1)/2-W/2)>W*0.05)?"YES":"no")
  ].join(" | ");
}
setTimeout(function(){
  document.getElementById("rep").textContent=stats();
  document.getElementById("px").value=document.getElementById("p2-art").toDataURL("image/png");
  document.title="RDY";
}, 11000);
</script></body></html>
