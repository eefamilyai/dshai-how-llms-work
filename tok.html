<!doctype html><html><head><meta charset="utf-8"><title>TOKPLATE</title>
<style>html,body{margin:0;padding:0;background:#04060c;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
#rep{position:fixed;left:8px;top:8px;color:#22d3ee;font:14px monospace;white-space:pre;z-index:9}
</style></head><body>
<canvas id="p2-art"></canvas><pre id="rep">...</pre>
<script src="anim.js?v=7"></script>
<script>
setTimeout(function(){
  var cv=document.getElementById("p2-art"), c=cv.getContext("2d");
  var W=cv.width,H=cv.height,d=c.getImageData(0,0,W,H).data;
  var bright=0, greenHi=0, amberHi=0, boxEdge=0;
  var gTop=0,gBot=0,aTop=0,aBot=0;
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    var i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2],a=d[i+3]; if(a<10)continue;
    var lum=0.299*r+0.587*g+0.114*b;
    if(lum>200){ bright++; }
    if(g>200&&r<130&&b>120&&b<200){ greenHi++; if(y>H*0.45)gBot++; else gTop++; }
    if(r>230&&g>170&&b<90){ amberHi++; if(y>H*0.45)aBot++; else aTop++; }
  }
  document.getElementById("rep").textContent=
    "canvas "+W+"x"+H+"\n"+
    "bright(>200lum) "+bright+"\n"+
    "bright-green "+greenHi+"  top="+gTop+" bot="+gBot+"\n"+
    "bright-amber "+amberHi+"  top="+aTop+" bot="+aBot+"\n"+
    "verdict: "+((bright>20000&&greenHi>3000&&amberHi>3000)?"BOTH ROWS RESOLVED":"sparse - check phase");
}, 3000);
</script></body></html>
