<!doctype html><html><head><meta charset="utf-8"><title>VERIFY</title>
<style>html,body{margin:0;background:#04060c}
#out{position:fixed;left:0;top:0;color:#22d3ee;font:13px monospace;white-space:pre;z-index:9}
</style></head><body>
<canvas id="hero-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p1-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p2-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p3-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p4-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p5-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p6-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p7-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p8-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p9-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p10-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p11-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p12-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas>
<canvas id="p13-art" width="900" height="560" style="width:900px;height:560px;display:block"></canvas><pre id="out">...</pre>
<script src="anim.js?v=11"></script>
<script>
var IDS="hero-art","p1-art","p2-art","p3-art","p4-art","p5-art","p6-art","p7-art","p8-art","p9-art","p10-art","p11-art","p12-art","p13-art";
function m(id){
  var cv=document.getElementById(id), c=cv.getContext("2d");
  var W=cv.width,H=cv.height,d=c.getImageData(0,0,W,H).data;
  var ink=0,lum=0,hi=0, minx=1e9,maxx=-1,miny=1e9,maxy=-1;
  for(var y=0;y<H;y++)for(var x=0;x<W;x++){
    var i=(y*W+x)*4,r=d[i],g=d[i+1],b=d[i+2],a=d[i+3]; if(a<10)continue;
    var L=0.299*r+0.587*g+0.114*b; if(L<26)continue;
    ink++; lum+=L; if(L>170)hi++;
    if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
  }
  return {ink:ink, mean: ink?lum/ink:0, hiPct: ink?100*hi/ink:0,
          w:maxx-minx, h:maxy-miny, cx:(minx+maxx)/2, cy:(miny+maxy)/2};
}
setTimeout(function(){
  var out=[];
  for(var i=0;i<IDS.length;i++){
    var s=m(IDS[i]);
    out.push(IDS[i].padEnd(11)+
      " ink="+String(s.ink).padStart(7)+
      " mean="+s.mean.toFixed(0).padStart(4)+
      " bright%="+s.hiPct.toFixed(0).padStart(3)+
      " bbox="+s.w+"x"+s.h+
      " centre=("+s.cx.toFixed(0)+","+s.cy.toFixed(0)+")");
  }
  document.getElementById("out").textContent=out.join("\n");
}, 15000);
</script></body></html>
